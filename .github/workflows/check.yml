name: Check game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm run setup
      - run: npm test
      - run: npm run build:hosted
# Check the same client/server build used by Render, including mobile input tests.
# Publication instructions and verified address are in docs/DEPLOY.md.
